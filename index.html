    </section><section class="below-hero"><div><strong>어떤 결과가 나오나요?</strong><p>포지션 5개 비교 · 심층 성향 분석 · 추천 챔피언 TOP 5 · 친구와 결과 공유</p></div><div class="role-pills"><span>TOP</span><span>JUNGLE</span><span>MID</span><span>ADC</span><span>SUPPORT</span></div></section>`}
  function questionHTML(){const n=answers.length,q=quiz[n];return `<section class="quiz-wrap fade-in"><div class="quiz-meta"><span>DISCOVERY IN PROGRESS</span><span>${String(n+1).padStart(2,'0')} / ${quiz.length}</span></div><div class="bar-bg" role="progressbar" aria-label="질문 진행도" aria-valuemin="0" aria-valuemax="12" aria-valuenow="${n}"><div class="bar-fill" style="width:${n/quiz.length*100}%"></div></div><div class="q-overline">QUESTION ${String(n+1).padStart(2,'0')}</div><h1 class="question">${esc(q.title)}</h1><p class="q-sub">${esc(q.sub)}</p><div class="options">${q.opts.map((opt,i)=>`<button class="option" data-option="${i}"><span class="letter">${letters[i]}</span><span class="answer-text">${esc(opt[0])}</span><span class="chevron" aria-hidden="true">↗</span></button>`).join('')}</div><div class="q-footer"><button class="back" id="prevBtn" ${n===0?'disabled':''}>← 이전 질문</button><span class="hint">정답은 없어. 가장 끌리는 선택지를 골라 줘.</span></div></section>`}
  function calc(){let score={top:0,jungle:0,mid:0,adc:0,support:0},t={};for(let i=0;i<answers.length;i++){const o=quiz[i].opts[answers[i]];Object.entries(o[1]).forEach(([k,v])=>score[k]+=v);o[2].forEach(k=>t[k]=(t[k]||0)+1)}
    const ranks=roleOrder.map((id,order)=>({id,score:score[id],order})).sort((a,b)=>b.score-a.score||a.order-b.order);
    const topTraits=Object.entries(t).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
    const points=(c)=>c.base+c.tags.reduce((sum,k)=>sum+(t[k]||0),0)+(t.easy||0)*(c.diff==='쉬움'?.3:c.diff==='어려움'?-.4:0);
    const primary=champions[ranks[0].id].map(c=>({...c,role:ranks[0].id,fit:points(c)})).sort((a,b)=>b.fit-a.fit);
    const secondary=champions[ranks[1].id].map(c=>({...c,role:ranks[1].id,fit:points(c)})).sort((a,b)=>b.fit-a.fit);
    const selected=[...primary.slice(0,4),...secondary.filter(c=>!primary.slice(0,4).some(p=>p.id===c.id)).slice(0,1)];
    let archetype,lead;
    if(ranks[0].id==='top'){archetype=(t.counter||0)>=3?'전략적인 카운터 파이터':(t.engage||0)>=(t.patient||0)?'거침없는 전방 돌격대장':'침착한 1대1 승부사';lead=(t.counter||0)>=3?'상대의 공격을 받아내고 빈틈을 읽어, 가장 유리한 순간에 강하게 반격하는 전사형 플레이어.':'강한 근접 전투와 독립적인 라인 운영에서 만족감을 얻는 전사형 플레이어.'}
    else if(ranks[0].id==='jungle'){archetype=(t.map||0)>=(t.engage||0)?'전장을 읽는 전략적인 사냥꾼':'기회를 놓치지 않는 공격형 정글러';lead='한곳에 머무르기보다 경기 전체의 흐름을 읽고 필요한 순간에 전투를 만드는 플레이어.'}
    else if(ranks[0].id==='mid'){archetype=(t.burst||0)>=(t.control||0)?'순간을 지배하는 플레이메이커':'전투의 흐름을 설계하는 마법사';lead='상대의 빈틈에 정확한 스킬을 적중시켜 결정적인 장면을 만드는 플레이어.'}
    else if(ranks[0].id==='adc'){archetype=(t.late||0)>=(t.burst||0)?'후반을 지배하는 화력 설계자':'한 방을 만드는 정밀 사수';lead='거리와 타이밍을 계산하면서 적에게 지속적으로 큰 피해를 입히는 플레이어.'}
    else{archetype=(t.protect||0)>=(t.engage||0)?'팀을 지키는 전술적 수호자':'승부를 여는 전방 지휘관';lead='아군의 움직임을 조율하고 적을 제어해 승리의 장면을 설계하는 플레이어.'}
    return {score,t,ranks,topTraits,selected,archetype,lead};
  }
  function analysisCards(result){const t=result.t;const rankedTraits=result.topTraits;const descriptions={
      counter:['반격을 노리는 타이밍','상대가 먼저 기술을 쓰도록 유도하고 빈틈이 생겼을 때 싸우는 스타일을 좋아해.'],
      map:['전장을 보는 전략적 판단','팀 전체의 상황을 파악하고 움직임으로 흐름을 바꾸는 플레이에 흥미가 있어.'],
      power:['강한 화력의 성취감','적에게 확실한 피해를 주고 전투 결과를 뒤집는 순간에서 만족감을 얻어.'],
      duel:['스스로 증명하는 1대1','혼자 상대를 이기고 맡은 구역에서 우위를 점하는 승부를 즐겨.'],
      protect:['아군을 지키는 책임감','팀원을 위험에서 구하거나 좋은 전투 환경을 만들어 주는 역할을 좋아해.'],
      late:['차근차근 강해지는 성장형','안전하게 성장해 시간이 지난 뒤 강력한 존재가 되는 과정을 좋아해.'],
      precision:['정확한 한 순간의 집중력','정해진 타이밍에 스킬을 적중시켜 승부를 뒤집는 장면을 선호해.'],
      heavy:['묵직한 근접 전투','빠른 연속 기술보다는 강한 기본 공격과 근거리의 압박감을 좋아해.'],
      patient:['신중하고 침착한 운영','무모하게 달려들기보다는 기다렸다가 유리한 순간에 행동하는 경향이 있어.'],
      easy:['조작보다 판단이 우선','복잡한 버튼 조합보다 상황 분석과 기본기로 상대를 이기는 재미를 더 중요하게 생각해.'],
      engage:['앞장서는 전투 스타일','중요한 싸움에서 먼저 진입하고 전투를 개시하는 역할에 끌려.'],
      ranged:['안전한 거리의 화력','사거리를 살려 안전한 위치에서 상대를 공격하는 스타일을 선호해.'],
      burst:['강력한 결정타','여러 차례 작은 공격보다 한 번의 인상적인 기술로 전황을 바꾸는 데 끌려.'],
      team:['팀과 함께하는 영향력','동료들과의 호흡을 통해 혼자서는 만들기 어려운 승리를 얻는 것을 좋아해.'],
      solo:['독립적인 플레이','내가 맡은 구역에서 스스로 성장하고 실력으로 보여 주는 플레이에 끌려.'],
      spacing:['거리와 기회 조절','무작정 돌격하기보다는 적정 거리를 유지하고 좋은 타이밍을 찾는 선택을 해.'],
      tank:['버텨내는 힘','단숨에 쓰러지지 않고 공격을 견디면서 전투의 흐름을 바꾸는 역할을 좋아해.'],
      roam:['뜻밖의 변수 만들기','예상하지 못한 곳으로 움직이며 중요한 순간을 만드는 플레이를 즐겨.'],
      control:['적의 움직임 제어','적을 멈추거나 불리한 위치로 몰아넣어 전투를 유리하게 설계해.'],
      combo:['연속 기술의 손맛','여러 스킬을 연결해 화려한 장면을 만드는 조작의 재미를 좋아해.']
    };return rankedTraits.slice(0,3).map((key,i)=>{let [title,desc]=descriptions[key]||[tags[key],`${tags[key]}에 관련된 선택이 많았어.`];return `<article class="analysis"><div class="no">CORE TRAIT / 0${i+1}</div><h3>${esc(title)}</h3><p>${esc(desc)}</p></article>`}).join('')}
  function championHTML(c,i,t){const relevant=c.tags.filter(k=>t[k]>0).sort((a,b)=>t[b]-t[a]).slice(0,2).map(k=>tags[k]);const why=relevant.length?`답변에서 ${relevant.join(' · ')} 같은 성향을 중요하게 골랐기 때문에 이 챔피언과 잘 맞아.`:'이 포지션에서 다른 전투 스타일도 시험해 보기 좋은 챔피언이야.';
    return `<article class="champ"><div class="champ-media"><div class="fallback" aria-hidden="true">${esc(c.id.slice(0,2).toUpperCase())}</div><img src="https://ddragon.leagueoflegends.com/cdn/img/champion/loading/${encodeURIComponent(c.id)}_0.jpg" loading="lazy" alt="${esc(c.name)} 챔피언 일러스트" onerror="this.style.display='none'"><span class="rank">NO. ${String(i+1).padStart(2,'0')}</span><span class="role-label">${roleData[c.role].short} / ${esc(roleData[c.role].name)}</span></div><div class="champ-body"><div class="champ-header"><h3>${esc(c.name)}</h3><span class="difficulty">입문 난이도 · ${c.diff}</span></div><div class="champ-hook">${esc(c.hook)}</div><p class="champ-desc">${esc(c.skill)}</p><div class="champ-facts"><div class="fact"><b>STRENGTHS / 장점</b>${esc(c.pros)}</div><div class="fact"><b>WEAKNESSES / 단점</b>${esc(c.cons)}</div></div><div class="why">✧ ${esc(why)}</div><a class="champ-link" href="https://www.leagueoflegends.com/ko-kr/champions/${encodeURIComponent(c.slug)}/" target="_blank" rel="noopener noreferrer">공식 챔피언 정보 보기 ↗</a></div></article>`}
  function resultHTML(){const r=calc(),first=roleData[r.ranks[0].id],second=roleData[r.ranks[1].id],max=r.ranks[0].score||1;
    const topTags=r.topTraits.slice(0,4).map(k=>`<span class="pill"># ${esc(tags[k])}</span>`).join('');
    return `<section class="results fade-in"><div class="eyebrow">IDENTITY REVEALED / ANALYSIS COMPLETE</div><div class="result-hero"><div><div class="section-kicker">YOUR PLAYSTYLE IDENTITY</div><h1>${esc(r.archetype)}</h1><p>${esc(r.lead)}</p><div class="meta-row">${topTags}</div></div><div class="role-big" aria-hidden="true">${first.icon}</div></div>
    <div class="result-actions"><button id="shareResult" class="primary">내 결과 공유하기 ↗</button><button id="copyResult" class="secondary">결과 링크 복사</button><button id="restart" class="secondary">테스트 다시 하기 ↻</button></div>
    <section class="section-block"><div class="section-kicker">01 / POSITION ANALYSIS</div><h2 class="section-title">나에게 맞는 포지션</h2><p class="section-desc">응답별로 합산한 테스트 내부 가중치 점수야. 실제 실력·승률이나 과학적으로 검증된 적성 점수는 아니야.</p><div class="score-layout"><div class="scores-card">${r.ranks.map((p,i)=>`<div class="score-row"><span class="score-name">${i===0?'★ ':''}${roleData[p.id].name}</span><div class="track"><div class="fill" style="width:${p.score/max*100}%"></div></div><span class="score-value">${p.score}pt</span></div>`).join('')}</div><div class="profile-card"><span class="number">PRIMARY · 01</span><h3>${first.icon} ${first.name}</h3><p>${first.detail}</p><div class="tag-list"><span class="tag">SECONDARY · ${second.name}</span><span class="tag">${first.type}</span></div><p style="margin-top:15px;font-size:12px">2순위 ${second.name}: ${second.detail}</p></div></div></section>
    <section class="section-block"><div class="section-kicker">02 / PLAYSTYLE TRAITS</div><h2 class="section-title">나의 전투 성향 분석</h2><p class="section-desc">반복해서 선택한 취향을 바탕으로 정리한 세 가지 특징이야.</p><div class="analysis-grid">${analysisCards(r)}</div></section>
    <section class="section-block"><div class="section-kicker">03 / CHAMPION MATCH</div><h2 class="section-title">맞춤 추천 챔피언 TOP 5</h2><p class="section-desc">1순위 포지션 챔피언 4명과 2순위 포지션 챔피언 1명을 추천해. 챔피언의 스킬과 플레이 방식에 대한 입문용 안내야.</p><div class="champ-list">${r.selected.map((c,i)=>championHTML(c,i,r.t)).join('')}</div></section>
    <section class="section-block"><div class="callout"><div><strong>친구의 플레이 스타일은 어떨까?</strong><p>테스트 링크를 공유해 서로의 포지션과 챔피언 결과를 비교해 봐. 내 결과만이 아니라 친구들도 직접 응답할 수 있어.</p></div><button class="primary" id="shareQuiz">테스트 공유하기 ↗</button></div></section><div class="credit">Made for fun · 테스트는 공식 Riot Games 진단 서비스가 아닙니다. 챔피언 정보와 역할은 패치에 따라 달라질 수 있습니다.</div></section>`;
  }
  function render(){app.innerHTML=mode==='intro'?introHTML():mode==='quiz'?questionHTML():resultHTML();
    document.getElementById('navAction').textContent=mode==='results'?'내 결과 공유 ↗':'친구에게 공유 ↗';
    if(mode==='intro'){document.getElementById('startBtn').addEventListener('click',newTest)}
    if(mode==='quiz'){app.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>{answers.push(Number(b.dataset.option));save();if(answers.length===quiz.length){viewingShared=false;history.replaceState(null,'',location.pathname);setMode('results')}else setMode('quiz')}));document.getElementById('prevBtn').addEventListener('click',()=>{if(answers.length){answers.pop();save();setMode('quiz')}})}
    if(mode==='results'){document.getElementById('restart').addEventListener('click',newTest);document.getElementById('shareResult').addEventListener('click',shareResults);document.getElementById('copyResult').addEventListener('click',()=>copyString(resultUrl(),'결과 링크가 복사됐어!'));document.getElementById('shareQuiz').addEventListener('click',shareQuiz)}
  }
  async function copyString(value,message){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value)}else{const el=document.createElement('textarea');el.value=value;el.style.position='fixed';el.style.top='-999px';document.body.append(el);el.select();if(!document.execCommand('copy'))throw Error('copy failed');el.remove()}toastMsg(message)}catch{toastMsg('자동 복사가 안 돼. 주소창의 링크를 직접 복사해 줘.')}}
  async function shareResults(){const r=calc();const data={title:'LANE / DNA — 나의 롤 플레이 성향',text:`내 롤 성향은 [${r.archetype}]! 1순위 ${roleData[r.ranks[0].id].name}, 추천 챔피언 ${r.selected[0].name}. 너도 테스트해 봐!`,url:resultUrl()};try{if(navigator.share){await navigator.share(data)}else await copyString(`${data.text}\n${data.url}`,'결과와 링크가 복사됐어!')}catch(e){if(e.name!=='AbortError')await copyString(data.url,'결과 링크가 복사됐어!')}}
  async function shareQuiz(){const url=location.href.split(/[?#]/)[0];try{if(navigator.share){await navigator.share({title:'LANE / DNA — 롤 포지션 테스트',text:'12문항으로 내 롤 포지션과 추천 챔피언을 알아보자!',url})}else await copyString(url,'테스트 링크가 복사됐어!')}catch(e){if(e.name!=='AbortError')await copyString(url,'테스트 링크가 복사됐어!')}}
  document.getElementById('homeLink').addEventListener('click',goHome);
  document.getElementById('navAction').addEventListener('click',()=>mode==='results'?shareResults():shareQuiz());
  (function init(){const url=new URL(location.href),param=url.searchParams.get('r');if(param&&/^\d{12}$/.test(param)){const a=param.split('').map(Number);if(valid(a)){answers=a;viewingShared=true;mode='results';render();return}}const stored=getStored();if(stored&&valid(stored)&&stored.length){answers=stored;mode=stored.length===quiz.length?'results':'quiz'}render()})();
  </script>
</body>
</html>
